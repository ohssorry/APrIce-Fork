[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aprice"
version = "0.1.0"
description = "Static analyzer that estimates API cost from source code and reports the delta on pull requests"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "APrIce Contributors" }]
keywords = ["api", "cost", "static-analysis", "llm", "finops", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aprice = "aprice.cli:main"

[project.urls]
Homepage = "https://github.com/APrIce-dev/aprice"
Issues = "https://github.com/APrIce-dev/aprice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aprice"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff formats Python blocks inside Markdown. Our docs use illustrative
# snippets -- aligned trailing comments, deliberately compact one-liners --
# that reformatting would flatten, and several are not valid standalone
# modules to begin with. Prose is not code we ship.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
