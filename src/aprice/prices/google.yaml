# Google Gemini API pricing, USD per million tokens.
# Source: https://ai.google.dev/gemini-api/docs/pricing (Paid Tier, standard
# text/image/video rate). Audio input, batch, caching, and per-request media
# pricing are not modeled by aprice yet, so only the base per-token rate is
# recorded here; anything that varies by request is called out in `note`.
provider: google
currency: USD
models:
  - id: gemini-2.5-pro
    input_per_mtok: 1.25
    output_per_mtok: 10.00
    verified_on: 2026-08-19
    note: >-
      Base rate for prompts <=200k tokens. Prompts >200k tokens are billed
      at 2.50 input / 15.00 output per Mtok.

  - id: gemini-2.5-flash
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    verified_on: 2026-08-19
    note: Audio input is billed at 1.00 per Mtok instead of the listed rate.

  - id: gemini-2.5-flash-lite
    input_per_mtok: 0.10
    output_per_mtok: 0.40
    verified_on: 2026-08-19
    note: Audio input is billed at 0.30 per Mtok instead of the listed rate.

  - id: gemini-3.1-pro-preview
    input_per_mtok: 2.00
    output_per_mtok: 12.00
    verified_on: 2026-08-19
    note: >-
      Base rate for prompts <=200k tokens. Prompts >200k tokens are billed
      at 4.00 input / 18.00 output per Mtok.

  - id: gemini-3.1-flash-lite
    input_per_mtok: 0.25
    output_per_mtok: 1.50
    verified_on: 2026-08-19
    note: Audio input is billed at 0.50 per Mtok instead of the listed rate.

  - id: gemini-3.5-flash
    input_per_mtok: 1.50
    output_per_mtok: 9.00
    verified_on: 2026-08-19

  - id: gemini-3.5-flash-lite
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    verified_on: 2026-08-19

  - id: gemini-3.6-flash
    input_per_mtok: 0.75
    output_per_mtok: 3.75
    verified_on: 2026-08-19
    note: Introductory rate through 2026-12-31; rises to 1.50 / 7.50 on 2027-01-01.

  - id: gemini-3.7-flash
    input_per_mtok: 0.75
    output_per_mtok: 3.75
    verified_on: 2026-08-19
    note: Introductory rate through 2026-12-31; rises to 1.50 / 7.50 on 2027-01-01.
